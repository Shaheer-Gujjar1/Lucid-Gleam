    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Lucid Gleam - Teacher's Desk</title>
    <meta name="description" content="Modern class and student management for educators" />
    <meta name="author" content="TeachFlow" />

    <!-- Preconnect to critical origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin>

    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdn.gpteng.co">
    
    <!-- Premium Fonts - loaded asynchronously to avoid render blocking -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>

    <meta property="og:title" content="TeachFlow - Class Management" />
    <meta property="og:description" content="Modern class and student management for educators" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TeachFlow" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <body>
    <div id="root">
      <!-- Inline skeleton for faster LCP - hidden when React hydrates -->
      <div id="app-skeleton" style="min-height:100vh;display:flex;background:#f1f1f3;font-family:system-ui,sans-serif;">
        <div style="width:260px;background:#fafafa;padding:16px;border-right:1px solid #e5e5e5;">
          <div style="height:40px;width:120px;background:#e8e6f0;border-radius:8px;margin-bottom:24px;"></div>
          <div style="height:32px;background:#e8e6f0;border-radius:6px;margin-bottom:12px;"></div>
          <div style="height:32px;background:#e8e6f0;border-radius:6px;margin-bottom:12px;"></div>
          <div style="height:32px;background:#e8e6f0;border-radius:6px;"></div>
        </div>
        <div style="flex:1;padding:24px;">
          <div style="height:56px;background:#fafafa;border-radius:12px;margin-bottom:24px;display:flex;align-items:center;padding:0 20px;">
            <div style="height:32px;width:200px;background:#e8e6f0;border-radius:6px;"></div>
          </div>
          <div style="height:36px;width:180px;background:#e8e6f0;border-radius:8px;margin-bottom:16px;"></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
            <div style="height:120px;background:#fafafa;border-radius:12px;"></div>
            <div style="height:120px;background:#fafafa;border-radius:12px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
